server {
    server_name foundry.gitwork.co.uk;

    # Allow large uploads (receipt images, etc.)
    client_max_body_size 25M;

    # Don't volunteer the nginx version in the Server header. Pairs with
    # `poweredByHeader: false` in next.config.ts, which drops X-Powered-By for
    # the same reason: version strings are free reconnaissance for anyone
    # matching a stack against known CVEs. Header becomes `Server: nginx`.
    server_tokens off;

    # Compress text responses. The Deck shell (public/deck/index.html) is the
    # one that really pays: a single self-contained ~504KB file, served on every
    # open, that compresses to ~390KB. Everything else here is HTML/JSON/JS/CSS
    # which compresses well too. gzip_vary so caches key on Accept-Encoding.
    #
    # Deliberately NOT gzipping images: PNG/JPEG/WebP/AVIF are already
    # compressed, so it burns CPU for ~0 bytes. SVG is text and is included.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;   # 5 is the knee of the curve — 6+ costs CPU for <2%
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;
    # text/html is always gzipped by nginx and must not be listed (doing so
    # emits a duplicate-MIME warning on `nginx -t`).

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        # Bigger header buffers — the app emits large Set-Cookie headers
        # (gitwork_api_session + NextAuth session JWT). nginx defaults (4k/8k)
        # caused intermittent 502 "upstream sent too big header". Added 2026-07-08.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/foundry.gitwork.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/foundry.gitwork.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
  
server {
    if ($host = foundry.gitwork.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name foundry.gitwork.co.uk;
    return 404; # managed by Certbot


}