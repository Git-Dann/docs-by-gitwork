# Staging: staging.foundry.gitwork.co.uk → the staging app on 127.0.0.1:3001 (docs/staging.md).
#
# Not applied by any workflow. Install it once by hand, as docs/staging.md says:
#   sudo cp staging.conf /etc/nginx/sites-available/foundry-staging
#   sudo ln -s /etc/nginx/sites-available/foundry-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.foundry.gitwork.co.uk
# certbot then adds the 443 listener and the certificate lines, as it did for foundry.conf.
#
# Behind a password (HTTP basic auth) as well as Foundry's own sign-in: staging runs any branch,
# so it is never left open to the internet. Create the password file once:
#   sudo htpasswd -c /etc/nginx/foundry-staging.htpasswd gitwork
server {
    server_name staging.foundry.gitwork.co.uk;
    listen 80;
    listen [::]:80;

    client_max_body_size 25M;
    server_tokens off;

    auth_basic "Foundry staging";
    auth_basic_user_file /etc/nginx/foundry-staging.htpasswd;

    # Never in a search engine, whatever the page itself says.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # certbot's HTTP-01 challenge must get through the password.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser's Basic password is for nginx only; the app never sees it.
        proxy_set_header Authorization "";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        # Same header buffers as production: the session cookie is large (deploy/nginx/README.md).
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
