# Foundry STAGING — nginx site config
#
# Adapted from deploy/nginx/foundry.conf. Three deliberate differences:
#   1. server_name + cert paths → staging.foundry.gitwork.tech
#   2. proxy_pass → 127.0.0.1:3001 (production is 3000)
#   3. A blanket robots.txt returning `Disallow: /` — see the note on it below.
#
# ⚠️ Like the production file, this is a CHECKED-IN MIRROR, not a deployed
# artefact. The deploy workflow only touches Docker. Applying it is scp +
# `nginx -t && systemctl reload nginx` — see deploy/nginx/README.md.
#
# The `listen 443 ssl` / ssl_certificate lines below are written as Certbot
# would write them. Run certbot FIRST (it creates the cert and can write these
# itself); if you paste this file in before the cert exists, `nginx -t` fails
# because the certificate path doesn't resolve.

server {
    server_name staging.foundry.gitwork.tech;

    # Allow large uploads (receipt images, etc.) — matches production.
    client_max_body_size 25M;

    # Don't volunteer the nginx version in the Server header. Same reasoning as
    # production: version strings are free reconnaissance.
    server_tokens off;

    # Keep staging out of search results ENTIRELY, and do it here rather than in
    # the app. src/app/robots.ts is written for the production host and already
    # allows most of the site, so relying on it would let staging be indexed and
    # compete with production for the same content. Serving robots.txt from nginx
    # takes precedence over the Next route and cannot be undone by a deploy.
    #
    # NOTE this is belt-and-braces, not the real protection — /app is behind
    # Google OAuth regardless. It stops the PUBLIC pages (/portal/login,
    # /pulse-overview, /api-docs) being crawled under the staging hostname.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # gzip — see the long note in deploy/nginx/foundry.conf for why gzip_types is
    # spelled out (nginx.conf has it commented out, so without this only
    # text/html is compressed and every JS/CSS response goes out raw).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;
    # text/html is always gzipped by nginx and must not be listed (doing so
    # emits a duplicate-MIME warning on `nginx -t`).

    location / {
        # 3001 — staging's host port. Production is 3000.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        # Bigger header buffers — the app emits large Set-Cookie headers
        # (gitwork_api_session + NextAuth session JWT). nginx defaults (4k/8k)
        # caused intermittent 502 "upstream sent too big header" in production.
        # Staging runs the same app, so it needs the same buffers.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/staging.foundry.gitwork.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.foundry.gitwork.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = staging.foundry.gitwork.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name staging.foundry.gitwork.tech;
    return 404;
}
