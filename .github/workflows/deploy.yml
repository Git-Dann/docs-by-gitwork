name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  # Manual re-run, needed because the deploy now syncs secrets into the VPS .env:
  # after adding or rotating a secret there is nothing to push, but the box still
  # needs a deploy to pick it up. Actions tab → this workflow → "Run workflow".
  workflow_dispatch:

# Deploys MUST NOT run concurrently. Every run pushes the same `:latest` tag and
# then restarts the box, so two overlapping deploys race and WHICHEVER FINISHES
# LAST wins — which can be the OLDER commit. That really happened on 2026-07-28:
# two pushes a minute apart deployed in parallel, the earlier commit's build
# finished second, overwrote `:latest`, and production silently reverted, so a
# fix that had "successfully deployed" was not actually running.
#
# cancel-in-progress is deliberately FALSE: cancelling mid-run could interrupt
# the SSH/compose step and leave the box half-deployed. Queuing instead means an
# in-flight deploy finishes cleanly, and GitHub keeps only the newest pending run
# per group — so the latest commit is what lands, in order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Capture build metadata
        id: meta
        # `time` is the deploy timestamp shown in the sidebar footer.
        # `version` is <package.json version>.<github.run_number> — auto-increments per push
        # so every deploy shows a new number without touching package.json (bump the semver
        # in package.json only for real major/minor releases).
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/git-dann/docs-by-gitwork:latest
            ghcr.io/git-dann/docs-by-gitwork:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          # ── Managed secrets ───────────────────────────────────────────────────
          # Secrets set HERE (repo → Settings → Secrets and variables → Actions) are
          # synced into the VPS `.env` on every deploy, so setting one no longer needs
          # SSH and a hand-edited file on the box.
          #
          # ⚠️ The Actions secret is FOUNDRY_GITHUB_TOKEN, not GITHUB_TOKEN: GitHub
          # REJECTS any secret name starting with `GITHUB_` (that name is reserved for
          # the token Actions injects itself, used for GHCR login above). It is written
          # to the VPS as GITHUB_TOKEN, which is what the app reads.
          #
          # Why this exists: GITHUB_TOKEN was "never set in prod" (see
          # docs/fasthosts-secrets-recovery.md), so every Pulse repo scan read nothing
          # for months while still reporting a plausible score. A secret that only
          # lives in one hand-edited file is a secret that silently goes missing.
          FOUNDRY_GITHUB_TOKEN: ${{ secrets.FOUNDRY_GITHUB_TOKEN }}
          # Provenance's issuer seal (CLAUDE.md §38). Optional: with it absent every Hallmark
          # is issued UNSEALED and says so on the certificate, which is a deliberate
          # honest degrade rather than a failure — so an unset secret is a no-op here,
          # not a broken deploy.
          #
          # ⚠️ Rotating this makes every previously-issued seal report UNVERIFIABLE. The
          # digest still verifies (contents provably unaltered) but authenticity can no
          # longer be confirmed. Treat it as long-lived: `openssl rand -base64 32`.
          PROVENANCE_SIGNING_SECRET: ${{ secrets.PROVENANCE_SIGNING_SECRET }}
          # Pre-rename name, still synced so a secret set under it keeps working — digest.ts
          # reads it as a fallback specifically so seals issued before the rename still
          # VERIFY rather than silently becoming UNVERIFIABLE. Drop once PROVENANCE_ is set.
          ASSAY_SIGNING_SECRET: ${{ secrets.ASSAY_SIGNING_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Passed over the SSH channel, never interpolated into a logged command line.
          envs: FOUNDRY_GITHUB_TOKEN,PROVENANCE_SIGNING_SECRET,ASSAY_SIGNING_SECRET
          script: |
            cd /opt/apps/foundry

            # Idempotent upsert of one key in .env. Never prints the value.
            # An empty value is a NO-OP rather than a delete, so a secret that isn't
            # set in Actions can't wipe one that was set by hand on the box.
            upsert_env() {
              key="$1"
              val="$2"
              if [ -z "$val" ]; then
                echo "  $key: not provided by CI — leaving .env untouched"
                return 0
              fi
              touch .env
              # Guarantee a trailing newline: appending to a file that lacks one
              # concatenates onto the previous variable and corrupts both.
              if [ -n "$(tail -c1 .env 2>/dev/null)" ]; then printf '\n' >> .env; fi
              if grep -q "^${key}=" .env; then
                grep -v "^${key}=" .env > .env.next
                printf '%s=%s\n' "$key" "$val" >> .env.next
                cat .env.next > .env   # preserve the original file's inode + perms
                rm -f .env.next
                echo "  $key: updated from CI"
              else
                printf '%s=%s\n' "$key" "$val" >> .env
                echo "  $key: added from CI"
              fi
              chmod 600 .env
            }

            echo "Syncing managed secrets into .env"
            upsert_env GITHUB_TOKEN "${FOUNDRY_GITHUB_TOKEN:-}"
            upsert_env PROVENANCE_SIGNING_SECRET "${PROVENANCE_SIGNING_SECRET:-}"
            upsert_env ASSAY_SIGNING_SECRET "${ASSAY_SIGNING_SECRET:-}"

            docker compose pull app
            docker compose up -d db
            # The migration must GATE the restart. ssh-action runs this script
            # without `set -e` and without script_stop, and the step's success is
            # decided by the last command — so a failed `db push` used to fall
            # straight through to the restart below, shipping code that reads
            # columns the database does not have, and reporting a green deploy.
            #
            # Guarded here rather than with `set -e` on the whole script, which
            # would newly abort the deploy on any incidental non-zero exit above.
            if ! docker compose run --rm --no-deps --user root --entrypoint sh app \
              -c "npx --yes prisma@6.19.3 db push --schema=prisma/schema.prisma --skip-generate"; then
              echo "::error::prisma db push failed — leaving the running app on the previous image rather than restarting it against an unmigrated database."
              exit 1
            fi
            # Recreate so the container picks up any .env change made above.
            docker compose up -d --no-deps --force-recreate app
            docker image prune -f
