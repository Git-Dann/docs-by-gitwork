name: Deploy to staging

# Staging (docs/staging.md): any branch, tag or commit, on the same VPS as production but in its
# own Compose project (`foundry-staging`), its own directory (/opt/apps/foundry-staging), its own
# database (`foundry_staging`, its own volume) and its own port (127.0.0.1:3001). It never touches
# production's containers, image tags or database, and it only runs when someone dispatches it:
# Actions → "Deploy to staging" → Run workflow → pick the ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or full commit sha to deploy to staging"
        required: true
        default: main
      seed:
        description: "Seed the demo data afterwards (Pulse, Study, Provenance, Starters, DevSignal)"
        type: boolean
        default: false

# Never two staging deploys at once. Separate from `deploy-production`: staging has its own
# directory, tag, project and containers, so it cannot race a production deploy on the box.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout the chosen ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Capture build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}.${{ github.run_number }}-staging" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          # ⚠️ Never :latest or :previous here: those are production's. Pushing :latest from a
          # second workflow is how production silently reverted on 2026-07-28.
          tags: |
            ghcr.io/git-dann/docs-by-gitwork:staging
            ghcr.io/git-dann/docs-by-gitwork:staging-${{ steps.meta.outputs.sha }}
          build-args: |
            COMMIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # The compose file and the health check travel to the box as one base64 tar over the SSH
      # channel (the box has no checkout). Taken from the default branch, not the chosen ref, so an
      # old ref can't bring back an old, unsafe staging setup. Neither file holds a secret.
      - name: Checkout (staging files only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            docker-compose-staging.yml
            deploy/health-check.sh
            deploy/staging-deploy.sh
          sparse-checkout-cone-mode: false

      - name: Encode the staging files
        id: release
        run: |
          set -euo pipefail
          for f in docker-compose-staging.yml deploy/health-check.sh deploy/staging-deploy.sh; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty in the checkout (sparse-checkout list?)"; exit 1; }
          done
          echo "bundle_b64=$(tar czf - docker-compose-staging.yml deploy/health-check.sh deploy/staging-deploy.sh | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Deploy to the VPS (staging)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          FOUNDRY_STAGING_B64: ${{ steps.release.outputs.bundle_b64 }}
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.sha }}
          STAGING_SEED: ${{ inputs.seed && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: FOUNDRY_STAGING_B64,DEPLOY_SHA,STAGING_SEED
          script: |
            set -euo pipefail
            WORK="$(mktemp -d)"
            trap 'rm -rf "$WORK"' EXIT
            printf '%s' "$FOUNDRY_STAGING_B64" | base64 -d | tar xzf - -C "$WORK"
            STAGING_DIR=/opt/apps/foundry-staging bash "$WORK/deploy/staging-deploy.sh" "$WORK" "$DEPLOY_SHA" "$STAGING_SEED"
