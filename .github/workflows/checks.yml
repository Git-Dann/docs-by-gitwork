name: Checks

# The repo had no PR-triggered workflow before this: `deploy.yml` runs only on a
# push to `main`, and goes straight to build → GHCR → VPS. So nothing verified a
# branch before it landed on production. This is that gate.
#
# Deliberately DB-free: `npm run build` runs `prisma db push` against whatever
# DATABASE_URL it is given, so it must never run in CI. `prisma generate` gives
# the client that `tsc` needs without touching a database.

on:
  pull_request:
  push:
    branches:
      - main
  # So a branch can be checked before its PR exists.
  workflow_dispatch:

# A new push to a PR supersedes the previous run.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Self-test first: the rules are heuristics over source, so a rule that has
      # silently stopped firing would otherwise report a clean pass.
      - name: UI standards audit — self-test
        run: npm run audit:ui -- --self-test

      - name: UI standards audit
        run: npm run audit:ui

      # `npx next build`, NOT `npm run build` — the npm script runs `prisma db push`
      # first and would mutate whatever database it was pointed at. Verified to
      # compile and prerender all 101 static pages with no DATABASE_URL set, so it
      # catches the RSC-boundary and static-generation breakage `tsc` can't see.
      - name: Build
        run: npx next build
