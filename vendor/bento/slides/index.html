<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The editor UI is light-only. Declaring it opts out of Chrome-on-
         Android's auto-darkening (which force-inverts pages and breaks form
         controls) and keeps native <select>/<input> rendering light on
         dark-mode phones. -->
    <meta name="color-scheme" content="only light" />
    <meta name="generator" content="Foundry Deck" />
    <!--
      FOUNDRY: the platform's OWN favicon, byte-for-byte the same shape as
      src/app/icon.svg — a solid #4F46E5 disc. Deck's tab must sit beside a
      Foundry tab and look like the same product. This was upstream's tile
      triptych repainted blue, which read as a different app entirely.
      foundry/boot.ts swaps it for the Gitwork disc under the Gitwork brand.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%234F46E5'/%3E%3C/svg%3E" />
    <title>Foundry Deck</title>
    <!--

      The document lives in the script block below. The runtime replaces its
      contents on every save, so this one file is both the app and the document.
      An empty block means "boot with the starter deck".
    -->
    <script type="application/bento+json" id="bento-doc"></script>
  </head>
  <body>
    <!-- splash: pure CSS, paints before the bundle parses; main.ts dismisses it -->
    <div id="deck-splash" aria-hidden="true">
      <!-- FOUNDRY: house wordmark. Mono caps + tracking, per DESIGN.md. -->
      <div class="bs-word"><b>Foundry</b>Deck</div>
      <div class="bs-bar"><i></i></div>
    </div>
    <style>
#deck-splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:26px;background:radial-gradient(130% 90% at 50% 38%,#1E293B 0%,#0F172A 58%,#0B1220 100%);pointer-events:none;transition:opacity .5s ease;animation:bsAuto .6s ease 9s both}
#deck-splash.done{opacity:0}
.bs-word{font:500 14px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:#F8FAFC;letter-spacing:.42em;text-transform:uppercase;text-indent:.42em;animation:bsUp .5s ease .1s both}
.bs-word b{color:#BFDBFE;font-weight:600}
.bs-bar{width:124px;height:2px;border-radius:1px;background:rgba(255,255,255,.13);overflow:hidden;animation:bsUp .45s ease .3s both}
.bs-bar i{display:block;width:44%;height:100%;border-radius:1px;background:linear-gradient(90deg,#1D4ED8,#3B82F6);animation:bsScan 1.1s cubic-bezier(.45,0,.55,1) 1s infinite alternate}
@keyframes bsUp{from{opacity:0;transform:translateY(10px)}}
@keyframes bsScan{from{transform:translateX(-30%)}to{transform:translateX(210%)}}
@keyframes bsAuto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#deck-splash,#deck-splash *{animation-duration:.01ms;animation-delay:0ms;animation-iteration-count:1}}
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
