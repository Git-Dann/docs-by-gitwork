services:
  db:
    # Must ship the pgvector extension — bootstrap.ts runs CREATE EXTENSION
    # IF NOT EXISTS vector on every boot for Care's semantic search (CLAUDE.md
    # §23). Plain postgres:17-alpine never had it, so that call has been
    # failing on every deploy. No alpine build of pgvector/pgvector exists
    # (Debian-only), so this crosses musl → glibc under the existing
    # en_US.utf8-collated data directory — safe, but a `REINDEX DATABASE`
    # is required once after the image changes to rebuild any collation-
    # dependent text indexes under the new libc's sort rules.
    image: pgvector/pgvector:pg17
    container_name: foundry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundry
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/git-dann/docs-by-gitwork:latest
    container_name: foundry
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres_data:
