services:
  db:
    # Must ship the pgvector extension — bootstrap.ts runs CREATE EXTENSION
    # IF NOT EXISTS vector on every boot for Care's semantic search (CLAUDE.md
    # §23). Plain postgres:17-alpine never had it, so that call has been
    # failing on every deploy. No alpine build of pgvector/pgvector exists
    # (Debian-only), so this crosses musl → glibc under the existing
    # en_US.utf8-collated data directory — safe, but a `REINDEX DATABASE`
    # is required once after the image changes to rebuild any collation-
    # dependent text indexes under the new libc's sort rules.
    image: pgvector/pgvector:pg17
    container_name: foundry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundry
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry"]
      interval: 10s
      timeout: 5s
      retries: 5
    # If the box runs out of memory, the kernel kills the process with the highest OOM score.
    # Lower the database's so the app (which Docker restarts in seconds) goes first: a killed
    # Postgres means crash recovery and every request failing meanwhile. Not mem_limit: nobody
    # has measured what the database needs, and a wrong cap would kill it on purpose.
    oom_score_adj: -500
    # Rotate container logs. Without this the json-file driver keeps every line until the
    # container is recreated, on the same disk as the database (infra audit, Nov 2026).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    image: ghcr.io/git-dann/docs-by-gitwork:latest
    container_name: foundry
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only. nginx proxies 127.0.0.1:3000 and run-cron.sh calls it from the box.
      # Published on every interface ("3000:3000"), anyone could skip nginx and TLS and send
      # their own X-Real-IP, which every IP rate limit trusts. Docker publishes ports past
      # ufw, so the host firewall would not have stopped it.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # Rotate container logs. Without this the json-file driver keeps every line until the
    # container is recreated, on the same disk as the database (infra audit, Nov 2026).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
