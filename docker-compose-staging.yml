# Staging (docs/staging.md). Deployed by .github/workflows/deploy-staging.yml, only when someone
# dispatches it, which copies this file to /opt/apps/foundry-staging/docker-compose.yml on every
# deploy (deploy/staging-deploy.sh). It never lives in /opt/apps/foundry, production's directory.
#
# Every identifier below is deliberately distinct from docker-compose.yml (project, container
# names, port, volume, database, image tag) so staging can never collide with, or overwrite,
# production's containers, database or image on the same box. staging-deploy.sh checks the
# project name, the app container, the :staging image and the 127.0.0.1:3001 binding before it
# runs anything. Do not "simplify" these back to production's names.
name: foundry-staging

services:
  db:
    # pgvector, as production: bootstrap.ts runs CREATE EXTENSION IF NOT EXISTS vector on boot.
    image: pgvector/pgvector:pg17
    container_name: foundry-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundry_staging
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Localhost only: reach it over an SSH tunnel (ssh -L 5433:127.0.0.1:5433 <user>@<vps>),
      # never from the internet. 5433, not 5432, so it is obviously staging's.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      # -d explicit: pg_isready defaults dbname to the username, and there is no "foundry" here.
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Production's database goes last if the box runs out of memory; staging's goes early.
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  app:
    image: ghcr.io/git-dann/docs-by-gitwork:staging
    container_name: foundry-staging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost only; nginx proxies staging.foundry.gitwork.co.uk here (deploy/nginx/staging.conf).
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    # Smaller than production's 6 GB, so staging can never take memory production needs.
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_staging_data:
