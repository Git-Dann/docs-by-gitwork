ure, and share unlimited passwords across unlimited devices without restrictions.\n\nEVERYONE SHOULD HAVE THE TOOLS TO STAY SAFE ONLINE\nUtilize Bitwarden for free with no ads or selling data. Bitwarden believes everyone should have the ability to stay safe online. Premium plans offer access to advanced features.\n\nEMPOWER YOUR TEAMS WITH BITWARDEN\nPlans for Teams and Enterprise come with professional business features. Some examples include SSO integration, self-hosting, directory integration and SCIM provisioning, global policies, API access, event logs, and more.\n\nUse Bitwarden to secure your workforce and share sensitive information with colleagues.\n\n\nMore reasons to choose Bitwarden:\n\nWorld-Class Encryption\nPasswords are protected with advanced end-to-end encryption (AES-256 bit, salted hashing, and PBKDF2 SHA-256) so your data stays secure and private.\n\n3rd-party Audits\nBitwarden regularly conducts comprehensive third-party security audits with notable security firms. These annual audits include source code assessments and penetration testing across Bitwarden IPs, servers, and web applications.\n\nAdvanced 2FA\nSecure your login with a third-party authenticator, emailed codes, or FIDO2 WebAuthn credentials such as a hardware security key or passkey.\n\nBitwarden Send\nTransmit data directly to others while maintaining end-to-end encrypted security and limiting exposure.\n\nBuilt-in Generator\nCreate long, complex, and distinct passwords and unique usernames for every site you visit. Integrate with email alias providers for additional privacy.\n\nGlobal Translations\nBitwarden translations exist for more than 60 languages, translated by the global community though Crowdin.\n\nCross-Platform Applications\nSecure and share sensitive data within your Bitwarden Vault from any browser, mobile device, or desktop OS, and more.\n\nBitwarden secures more than just passwords\nEnd-to-end encrypted credential management solutions from Bitwarden empower organizations to secure everything, including developer secrets and passkey experiences. Visit Bitwarden.com to learn more about Bitwarden Secrets Manager and Bitwarden Passwordless.dev!",[1,4],1,1,["hello@bitwarden.com","1 N Calle Cesar Chavez Suite 102\nSanta Barbara, CA 93103-5619\nUS",null,1,null,"Bitwarden Inc.","Kyle Spearrin","Bitwarden Inc.","117396519","+19046649194","u941d7546c76ba2f4a7f919aefabeede7"],null,null,"2026.9.2",[1790362838,328630000],"22.68MiB",["Deutsch","English","English (United Kingdom)","Filipino","Indonesia","Nederlands","Tiếng Việt","Türkçe","azərbaycan","català","dansk","eesti","español","euskara","français","hrvatski","italiano","latviešu","lietuvių","magyar","norsk","polski","português (Brasil)","português (Portugal)","română","slovenčina","slovenščina","suomi","svenska","čeština","Ελληνικά","български","русский","српски","українська","עברית","العربية","فارسی","नेपाली","मराठी","हिन्दी","বাংলা","ଓଡ଼ିଆ","தமிழ்","తెలుగు","ಕನ್ನಡ","മലയാളം","සිංහල","ไทย","မြန်မာ","ქართული","中文（中国）","中文（台灣）","日本語","한국어"],null,null,null,null,1,[["ldgfbffkinooeloadekpmfoklnobpien","https://lh3.googleusercontent.com/GsyRyzu8R26g2Caw3_AEcZD7opQ2CADN9wOdPdq8-Rr-zBvLgC_BOCQrYUwECEQ-4iub4XOQw36QMyWhyBhMF6Vf","Raindrop.io",4.125,784,"https://lh3.googleusercontent.com/AaKz9ZdXbtXdZ7t0lMkOM2Vo2ci7921E6SrjDxSsKCXM7IQ0cYBXeqd5T3xkSjO_WosaRCOFTwFPl9ZPQT0_flEgm1w","All-in-one bookmark manager","http://raindrop.io/",1,1,null,["productivity/workflow",null,4],1,1,500000,1,"https://lh3.googleusercontent.com/zGcMeheXOSYCH_AW5Q5MKaWmelB5P4e5AmBI8XuZGM4LZSz1UP4SaHIDsjC-6cGzND7VzsugggJYq0WUqqV6LPcQaA",[1382619646,630000000],"{\n\"update_url\": \"https://clients2.google.com/service/update2/crx\",\n\n  \"manifest_version\": 3,\n  \"version\": \"6.8.2\",\n  \"version_name\": \"5.8.2\",\n  \"name\": \"Raindrop.io\",\n  \"description\": \"__MSG_appDesc__\",\n  \"homepage_url\": \"https://app.raindrop.io\",\n  \"author\": \"Mussabekov Rustem\",\n  \"short_name\": \"Raindrop.io\",\n  \"default
